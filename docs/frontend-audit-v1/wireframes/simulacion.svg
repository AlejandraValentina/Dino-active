<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860"><title>Preparar simulación y ejecución</title><desc>Wireframe ilustrativo. No captura del producto ni datos de simulación.</desc><g font-family="Segoe UI"><rect x="0" y="0" width="1360" height="860" rx="0" fill="#f3f5f8" stroke="#d3dce7"/><rect x="0" y="0" width="1360" height="30" rx="0" fill="#263546" stroke="#d3dce7"/><text x="18" y="20" fill="#fff" font-size="13" font-weight="400">PROPUESTA UX · WIREFRAME · datos ilustrativos, sin solver ni validación</text><rect x="0" y="30" width="1360" height="80" rx="0" fill="#fff" stroke="#d3dce7"/><text x="22" y="78" fill="#20364c" font-size="27" font-weight="700">DINO</text><text x="155" y="61" fill="#20364c" font-size="17" font-weight="700">MX125 · ejemplo de proyecto</text><text x="155" y="86" fill="#53657a" font-size="13" font-weight="400">2T nativo · núcleo del proyecto</text><text x="640" y="57" fill="#53657a" font-size="11" font-weight="400">VARIANTE ACTIVA</text><text x="640" y="81" fill="#20364c" font-size="15" font-weight="700">Motor base</text><text x="820" y="57" fill="#53657a" font-size="11" font-weight="400">REVISIÓN APLICADA</text><text x="820" y="81" fill="#20364c" font-size="15" font-weight="700">R7 · demostración</text><rect x="1050" y="53" width="130" height="30" rx="7" fill="#e3f3e9" stroke="#d3dce7"/><text x="1062" y="73" fill="#246345" font-size="12" font-weight="400">Guardado · demo</text><rect x="1200" y="50" width="135" height="35" rx="7" fill="#fff" stroke="#d3dce7"/><text x="1212" y="73" fill="#20364c" font-size="13" font-weight="400">Compartir…</text><rect x="0" y="110" width="196" height="750" rx="0" fill="#edf1f5" stroke="#d3dce7"/><rect x="13" y="130" width="170" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="25" y="153" fill="#fff" font-size="13" font-weight="700">Abrir / crear…</text><text x="18" y="203" fill="#53657a" font-size="11" font-weight="700">TRABAJO DEL PROYECTO</text><text x="18" y="240" fill="#20364c" font-size="13" font-weight="400">Inicio y proyecto</text><text x="18" y="287" fill="#20364c" font-size="13" font-weight="400">Motor y componentes</text><rect x="9" y="311" width="178" height="37" rx="7" fill="#d8e9f2" stroke="#d8e9f2"/><text x="18" y="334" fill="#145d86" font-size="13" font-weight="700">Preparar simulación</text><text x="18" y="381" fill="#20364c" font-size="13" font-weight="400">Corridas y cola</text><text x="18" y="428" fill="#20364c" font-size="13" font-weight="400">Resultados</text><text x="18" y="475" fill="#20364c" font-size="13" font-weight="400">Comparar variantes</text><text x="18" y="590" fill="#53657a" font-size="12" font-weight="400">Estado científico</text><text x="18" y="612" fill="#53657a" font-size="12" font-weight="400">Validación experimental</text><text x="18" y="634" fill="#53657a" font-size="12" font-weight="400">no realizada.</text><text x="18" y="656" fill="#53657a" font-size="12" font-weight="400">Predictividad no declarada.</text><text x="18" y="757" fill="#145d86" font-size="13" font-weight="400">Ayuda y diagnóstico</text><text x="220" y="840" fill="#53657a" font-size="12" font-weight="400">Diseño ilustrativo · contratos científicos independientes · selección y revisión persistentes</text><text x="220" y="153" fill="#20364c" font-size="27" font-weight="700">Preparar simulación</text><text x="220" y="181" fill="#53657a" font-size="14" font-weight="400">Planificar antes de gastar tiempo de cálculo.</text><rect x="220" y="205" width="720" height="590" rx="7" fill="#fff" stroke="#d3dce7"/><text x="240" y="238" fill="#20364c" font-size="19" font-weight="700">Punto operativo  /  Curva RPM</text><text x="240" y="286" fill="#20364c" font-size="14" font-weight="700">RPM inicial</text><rect x="240" y="300" width="210" height="40" rx="7" fill="#fff" stroke="#d3dce7"/><text x="252" y="326" fill="#20364c" font-size="15" font-weight="400">3000 RPM</text><text x="470" y="286" fill="#20364c" font-size="14" font-weight="700">RPM final</text><rect x="470" y="300" width="210" height="40" rx="7" fill="#fff" stroke="#d3dce7"/><text x="482" y="326" fill="#20364c" font-size="15" font-weight="400">4000 RPM</text><text x="700" y="286" fill="#20364c" font-size="14" font-weight="700">Incremento</text><rect x="700" y="300" width="210" height="40" rx="7" fill="#fff" stroke="#d3dce7"/><text x="712" y="326" fill="#20364c" font-size="15" font-weight="400">500 RPM</text><text x="240" y="379" fill="#20364c" font-size="14" font-weight="700">Máximo de ciclos por punto</text><rect x="240" y="394" width="320" height="40" rx="7" fill="#fff" stroke="#d3dce7"/><text x="252" y="420" fill="#20364c" font-size="15" font-weight="400">24 ciclos · ejemplo</text><text x="580" y="379" fill="#20364c" font-size="14" font-weight="700">Presupuesto por punto</text><rect x="580" y="394" width="340" height="40" rx="7" fill="#fff" stroke="#d3dce7"/><text x="592" y="420" fill="#20364c" font-size="15" font-weight="400">60 segundos · ejemplo</text><rect x="240" y="464" width="680" height="110" rx="7" fill="#eaf3f9" stroke="#d3dce7"/><text x="256" y="495" fill="#20364c" font-size="17" font-weight="700">3 puntos · 3000, 3500, 4000 RPM</text><text x="256" y="525" fill="#20364c" font-size="14" font-weight="400">Presupuesto agregado: 180 s + preparación / escritura.</text><text x="256" y="553" fill="#53657a" font-size="13" font-weight="400">Estimación de duración: desconocida sin una corrida comparable.</text><text x="240" y="614" fill="#20364c" font-size="16" font-weight="700">Configuración fijada al iniciar</text><text x="240" y="643" fill="#53657a" font-size="14" font-weight="400">Proyecto + variante + revisión + modelos + condiciones.</text><text x="240" y="665" fill="#53657a" font-size="14" font-weight="400">Una edición pendiente exige aplicar, descartar o cancelar.</text><rect x="240" y="737" width="238" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="252" y="760" fill="#fff" font-size="13" font-weight="700">Revisar plan y preflight…</text><rect x="490" y="737" width="205" height="35" rx="7" fill="#fff" stroke="#d3dce7"/><text x="502" y="760" fill="#20364c" font-size="13" font-weight="400">Agregar a cola…</text><rect x="960" y="205" width="375" height="290" rx="7" fill="#fff" stroke="#d3dce7"/><text x="980" y="238" fill="#20364c" font-size="18" font-weight="700">Preflight y alcance</text><text x="980" y="280" fill="#53657a" font-size="14" font-weight="400">OK · Identidad del proyecto</text><text x="980" y="312" fill="#53657a" font-size="14" font-weight="400">OK · Revisión de la variante</text><text x="980" y="344" fill="#53657a" font-size="14" font-weight="400">! Resolver ediciones pendientes</text><text x="980" y="376" fill="#53657a" font-size="14" font-weight="400">! Comprobar dominio del núcleo</text><text x="980" y="408" fill="#53657a" font-size="14" font-weight="400">! Espacio y destino de resultados</text><rect x="960" y="513" width="375" height="282" rx="7" fill="#fff" stroke="#d3dce7"/><text x="980" y="548" fill="#20364c" font-size="18" font-weight="700">Durante la ejecución</text><text x="980" y="580" fill="#53657a" font-size="13" font-weight="400">Fase: inicializar / integrar / escribir</text><text x="980" y="608" fill="#53657a" font-size="13" font-weight="400">Progreso por punto y ciclo</text><text x="980" y="636" fill="#53657a" font-size="13" font-weight="400">Transcurrido y presupuesto restante</text><text x="980" y="664" fill="#53657a" font-size="13" font-weight="400">Motivo de detención y datos persistidos</text><rect x="980" y="697" width="333" height="45" rx="7" fill="#fff8e8" stroke="#d3dce7"/><text x="990" y="716" fill="#805000" font-size="12" font-weight="400">Cancelar respeta el punto seguro del modelo.</text><text x="990" y="733" fill="#805000" font-size="12" font-weight="400">Reintentar no equivale a reinicio exacto.</text><text x="980" y="774" fill="#53657a" font-size="12" font-weight="400">Wireframe: no se hace preflight real.</text></g></svg>