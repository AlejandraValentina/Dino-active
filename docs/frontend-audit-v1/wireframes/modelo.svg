<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860"><title>Motor y componentes</title><desc>Wireframe ilustrativo. No captura del producto ni datos de simulación.</desc><g font-family="Segoe UI"><rect x="0" y="0" width="1360" height="860" rx="0" fill="#f3f5f8" stroke="#d3dce7"/><rect x="0" y="0" width="1360" height="30" rx="0" fill="#263546" stroke="#d3dce7"/><text x="18" y="20" fill="#fff" font-size="13" font-weight="400">PROPUESTA UX · WIREFRAME · datos ilustrativos, sin solver ni validación</text><rect x="0" y="30" width="1360" height="80" rx="0" fill="#fff" stroke="#d3dce7"/><text x="22" y="78" fill="#20364c" font-size="27" font-weight="700">DINO</text><text x="155" y="61" fill="#20364c" font-size="17" font-weight="700">MX125 · ejemplo de proyecto</text><text x="155" y="86" fill="#53657a" font-size="13" font-weight="400">2T nativo · núcleo del proyecto</text><text x="640" y="57" fill="#53657a" font-size="11" font-weight="400">VARIANTE ACTIVA</text><text x="640" y="81" fill="#20364c" font-size="15" font-weight="700">Motor base</text><text x="820" y="57" fill="#53657a" font-size="11" font-weight="400">REVISIÓN APLICADA</text><text x="820" y="81" fill="#20364c" font-size="15" font-weight="700">R7 · demostración</text><rect x="1050" y="53" width="130" height="30" rx="7" fill="#e3f3e9" stroke="#d3dce7"/><text x="1062" y="73" fill="#246345" font-size="12" font-weight="400">Guardado · demo</text><rect x="1200" y="50" width="135" height="35" rx="7" fill="#fff" stroke="#d3dce7"/><text x="1212" y="73" fill="#20364c" font-size="13" font-weight="400">Compartir…</text><rect x="0" y="110" width="196" height="750" rx="0" fill="#edf1f5" stroke="#d3dce7"/><rect x="13" y="130" width="170" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="25" y="153" fill="#fff" font-size="13" font-weight="700">Abrir / crear…</text><text x="18" y="203" fill="#53657a" font-size="11" font-weight="700">TRABAJO DEL PROYECTO</text><text x="18" y="240" fill="#20364c" font-size="13" font-weight="400">Inicio y proyecto</text><rect x="9" y="264" width="178" height="37" rx="7" fill="#d8e9f2" stroke="#d8e9f2"/><text x="18" y="287" fill="#145d86" font-size="13" font-weight="700">Motor y componentes</text><text x="18" y="334" fill="#20364c" font-size="13" font-weight="400">Preparar simulación</text><text x="18" y="381" fill="#20364c" font-size="13" font-weight="400">Corridas y cola</text><text x="18" y="428" fill="#20364c" font-size="13" font-weight="400">Resultados</text><text x="18" y="475" fill="#20364c" font-size="13" font-weight="400">Comparar variantes</text><text x="18" y="590" fill="#53657a" font-size="12" font-weight="400">Estado científico</text><text x="18" y="612" fill="#53657a" font-size="12" font-weight="400">Validación experimental</text><text x="18" y="634" fill="#53657a" font-size="12" font-weight="400">no realizada.</text><text x="18" y="656" fill="#53657a" font-size="12" font-weight="400">Predictividad no declarada.</text><text x="18" y="757" fill="#145d86" font-size="13" font-weight="400">Ayuda y diagnóstico</text><text x="220" y="840" fill="#53657a" font-size="12" font-weight="400">Diseño ilustrativo · contratos científicos independientes · selección y revisión persistentes</text><text x="220" y="153" fill="#20364c" font-size="27" font-weight="700">Motor y componentes</text><text x="220" y="181" fill="#53657a" font-size="14" font-weight="400">Una selección física, un inspector y una revisión aplicada.</text><rect x="220" y="205" width="174" height="590" rx="7" fill="#fff" stroke="#d3dce7"/><text x="235" y="235" fill="#20364c" font-size="16" font-weight="700">Componentes</text><rect x="230" y="252" width="154" height="34" rx="7" fill="#e6f1f7" stroke="#d3dce7"/><text x="240" y="274" fill="#145d86" font-size="13" font-weight="700">Cilindro y culata</text><text x="240" y="317" fill="#20364c" font-size="13" font-weight="400">Cárter</text><text x="240" y="360" fill="#20364c" font-size="13" font-weight="400">Admisión</text><text x="240" y="403" fill="#20364c" font-size="13" font-weight="400">Transferencias</text><text x="240" y="446" fill="#20364c" font-size="13" font-weight="400">Escape</text><text x="240" y="489" fill="#20364c" font-size="13" font-weight="400">Combustión</text><text x="240" y="532" fill="#20364c" font-size="13" font-weight="400">Pérdidas</text><text x="240" y="575" fill="#20364c" font-size="13" font-weight="400">Ambiente</text><text x="240" y="731" fill="#53657a" font-size="13" font-weight="400">Avanzado...</text><rect x="412" y="205" width="550" height="590" rx="7" fill="#fff" stroke="#d3dce7"/><text x="431" y="238" fill="#20364c" font-size="19" font-weight="700">Cilindro y culata</text><rect x="431" y="260" width="510" height="250" rx="7" fill="#f8fbfe" stroke="#d3dce7"/><text x="447" y="282" fill="#53657a" font-size="11" font-weight="400">ESQUEMA · NO A ESCALA</text><g stroke="#476982" stroke-width="2" fill="#e0eaf2"><rect x="630" y="300" width="100" height="100" rx="5"/><ellipse cx="680" cy="452" rx="59" ry="33"/><path d="M675 370V430L690 450"/></g><path d="M636 365H724" stroke="#d89d32" stroke-width="5"/><path d="M480 453H620M621 453H590V375H630M730 330H780L820 312H905" fill="none" stroke="#287ca3" stroke-width="6"/><text x="486" y="432" fill="#20364c" font-size="13" font-weight="400">Admisión</text><text x="770" y="296" fill="#20364c" font-size="13" font-weight="400">Escape</text><text x="642" y="491" fill="#20364c" font-size="13" font-weight="400">Cárter</text><text x="460" y="354" fill="#20364c" font-size="12" font-weight="400">Transferencias</text><text x="432" y="552" fill="#20364c" font-size="14" font-weight="700">Diámetro del cilindro</text><rect x="432" y="565" width="215" height="38" rx="7" fill="#fff" stroke="#d3dce7"/><text x="444" y="589" fill="#20364c" font-size="15" font-weight="400">56,0 mm</text><text x="679" y="552" fill="#20364c" font-size="14" font-weight="700">Carrera</text><rect x="679" y="565" width="261" height="38" rx="7" fill="#fff" stroke="#d3dce7"/><text x="691" y="589" fill="#20364c" font-size="15" font-weight="400">50,6 mm</text><text x="432" y="631" fill="#53657a" font-size="12" font-weight="400">Fuente: supuesto del ejemplo. Revisar al cargar medidas reales.</text><text x="432" y="653" fill="#53657a" font-size="12" font-weight="400">Los campos derivados muestran su relación; no se editan aparte.</text><rect x="432" y="681" width="508" height="45" rx="7" fill="#fff8e8" stroke="#d3dce7"/><text x="444" y="707" fill="#805000" font-size="12" font-weight="400">Borrador → aplicar → guardar. Ejecutar exige una decisión.</text><rect x="432" y="744" width="208" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="444" y="767" fill="#fff" font-size="13" font-weight="700">Aplicar borrador · demo</text><rect x="652" y="744" width="160" height="35" rx="7" fill="#fff" stroke="#d3dce7"/><text x="664" y="767" fill="#20364c" font-size="13" font-weight="400">Descartar edición</text><rect x="980" y="205" width="355" height="590" rx="7" fill="#f9fbfd" stroke="#d3dce7"/><text x="998" y="238" fill="#20364c" font-size="18" font-weight="700">Inspector del componente</text><text x="998" y="277" fill="#53657a" font-size="14" font-weight="400">Magnitud · unidad · convención</text><text x="998" y="299" fill="#53657a" font-size="14" font-weight="400">Procedencia del dato</text><text x="998" y="321" fill="#53657a" font-size="14" font-weight="400">Relaciones y valores derivados</text><text x="998" y="381" fill="#20364c" font-size="16" font-weight="700">Estado de edición</text><text x="998" y="409" fill="#53657a" font-size="13" font-weight="400">El borrador conserva sus cambios.</text><text x="998" y="431" fill="#53657a" font-size="13" font-weight="400">Una corrida usa la revisión aplicada.</text><text x="998" y="453" fill="#53657a" font-size="13" font-weight="400">Un resultado no pisa el formulario.</text><text x="998" y="523" fill="#20364c" font-size="16" font-weight="700">Acciones de contexto</text><text x="998" y="551" fill="#53657a" font-size="13" font-weight="400">Ver ayuda del parámetro</text><text x="998" y="573" fill="#53657a" font-size="13" font-weight="400">Inspeccionar configuración original</text><text x="998" y="595" fill="#53657a" font-size="13" font-weight="400">Revisar errores por campo</text><rect x="998" y="737" width="314" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="1010" y="760" fill="#fff" font-size="13" font-weight="700">Preparar simulación →</text></g></svg>