<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860"><title>Resultados y comparación</title><desc>Wireframe ilustrativo. No captura del producto ni datos de simulación.</desc><g font-family="Segoe UI"><rect x="0" y="0" width="1360" height="860" rx="0" fill="#f3f5f8" stroke="#d3dce7"/><rect x="0" y="0" width="1360" height="30" rx="0" fill="#263546" stroke="#d3dce7"/><text x="18" y="20" fill="#fff" font-size="13" font-weight="400">PROPUESTA UX · WIREFRAME · datos ilustrativos, sin solver ni validación</text><rect x="0" y="30" width="1360" height="80" rx="0" fill="#fff" stroke="#d3dce7"/><text x="22" y="78" fill="#20364c" font-size="27" font-weight="700">DINO</text><text x="155" y="61" fill="#20364c" font-size="17" font-weight="700">MX125 · ejemplo de proyecto</text><text x="155" y="86" fill="#53657a" font-size="13" font-weight="400">2T nativo · núcleo del proyecto</text><text x="640" y="57" fill="#53657a" font-size="11" font-weight="400">VARIANTE ACTIVA</text><text x="640" y="81" fill="#20364c" font-size="15" font-weight="700">Motor base</text><text x="820" y="57" fill="#53657a" font-size="11" font-weight="400">REVISIÓN APLICADA</text><text x="820" y="81" fill="#20364c" font-size="15" font-weight="700">R7 · demostración</text><rect x="1050" y="53" width="130" height="30" rx="7" fill="#e3f3e9" stroke="#d3dce7"/><text x="1062" y="73" fill="#246345" font-size="12" font-weight="400">Guardado · demo</text><rect x="1200" y="50" width="135" height="35" rx="7" fill="#fff" stroke="#d3dce7"/><text x="1212" y="73" fill="#20364c" font-size="13" font-weight="400">Compartir…</text><rect x="0" y="110" width="196" height="750" rx="0" fill="#edf1f5" stroke="#d3dce7"/><rect x="13" y="130" width="170" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="25" y="153" fill="#fff" font-size="13" font-weight="700">Abrir / crear…</text><text x="18" y="203" fill="#53657a" font-size="11" font-weight="700">TRABAJO DEL PROYECTO</text><text x="18" y="240" fill="#20364c" font-size="13" font-weight="400">Inicio y proyecto</text><text x="18" y="287" fill="#20364c" font-size="13" font-weight="400">Motor y componentes</text><text x="18" y="334" fill="#20364c" font-size="13" font-weight="400">Preparar simulación</text><text x="18" y="381" fill="#20364c" font-size="13" font-weight="400">Corridas y cola</text><rect x="9" y="405" width="178" height="37" rx="7" fill="#d8e9f2" stroke="#d8e9f2"/><text x="18" y="428" fill="#145d86" font-size="13" font-weight="700">Resultados</text><text x="18" y="475" fill="#20364c" font-size="13" font-weight="400">Comparar variantes</text><text x="18" y="590" fill="#53657a" font-size="12" font-weight="400">Estado científico</text><text x="18" y="612" fill="#53657a" font-size="12" font-weight="400">Validación experimental</text><text x="18" y="634" fill="#53657a" font-size="12" font-weight="400">no realizada.</text><text x="18" y="656" fill="#53657a" font-size="12" font-weight="400">Predictividad no declarada.</text><text x="18" y="757" fill="#145d86" font-size="13" font-weight="400">Ayuda y diagnóstico</text><text x="220" y="840" fill="#53657a" font-size="12" font-weight="400">Diseño ilustrativo · contratos científicos independientes · selección y revisión persistentes</text><text x="220" y="153" fill="#20364c" font-size="27" font-weight="700">Resultados de la corrida</text><text x="220" y="181" fill="#53657a" font-size="14" font-weight="400">Ejemplo A · revisión R7 · datos ilustrativos, sin solver.</text><rect x="220" y="205" width="1115" height="58" rx="7" fill="#fff8e8" stroke="#d3dce7"/><text x="238" y="229" fill="#805000" font-size="15" font-weight="700">No convergida: se pueden inspeccionar muestras transitorias.</text><text x="238" y="251" fill="#805000" font-size="13" font-weight="400">Las prestaciones no representan un resultado estacionario validado.</text><rect x="220" y="282" width="720" height="337" rx="7" fill="#fff" stroke="#d3dce7"/><text x="240" y="315" fill="#20364c" font-size="18" font-weight="700">Curvas · muestras · presión y eventos</text><g fill="none"><path d="M280 365V570H900" stroke="#70879b"/><path d="M280 420H900M280 470H900M280 520H900" stroke="#d4dee7"/><path d="M310 535L420 485L530 433M750 402L860 435" stroke="#287ca3" stroke-width="3"/><path d="M638 432l15 15m0-15l-15 15" stroke="#a86612" stroke-width="3"/></g><text x="310" y="355" fill="#53657a" font-size="11" font-weight="400">ESQUEMA ILUSTRATIVO · SIN DATOS DE SOLVER</text><text x="593" y="487" fill="#805000" font-size="13" font-weight="400">punto no admitido</text><text x="854" y="595" fill="#20364c" font-size="12" font-weight="400">RPM</text><rect x="960" y="282" width="375" height="337" rx="7" fill="#fff" stroke="#d3dce7"/><text x="980" y="315" fill="#20364c" font-size="18" font-weight="700">Interpretación del resultado</text><text x="980" y="355" fill="#53657a" font-size="13" font-weight="400">Ejecución: límite de ciclos</text><text x="980" y="394" fill="#53657a" font-size="13" font-weight="400">Periodicidad: no convergida</text><text x="980" y="433" fill="#53657a" font-size="13" font-weight="400">Integridad: hashes comprobados</text><text x="980" y="472" fill="#53657a" font-size="13" font-weight="400">Validación experimental: no realizada</text><text x="980" y="552" fill="#53657a" font-size="13" font-weight="400">Cada eje conserva su significado.</text><rect x="980" y="570" width="335" height="35" rx="7" fill="#fff" stroke="#d3dce7"/><text x="992" y="593" fill="#20364c" font-size="13" font-weight="400">Ver muestras y procedencia…</text><rect x="220" y="637" width="1115" height="158" rx="7" fill="#fff" stroke="#d3dce7"/><text x="240" y="669" fill="#20364c" font-size="17" font-weight="700">Comparar: elegir primero el par y conocer su elegibilidad</text><text x="240" y="700" fill="#53657a" font-size="13" font-weight="400">A: Motor base · R7     B: Escape B · R8</text><text x="240" y="722" fill="#53657a" font-size="13" font-weight="400">Familia, núcleo, RPM, condiciones y procedencia se comprueban antes de calcular.</text><text x="240" y="744" fill="#53657a" font-size="13" font-weight="400">La diferencia geométrica no implica ganancia de potencia demostrada.</text><rect x="1000" y="738" width="313" height="35" rx="7" fill="#145d86" stroke="#d3dce7"/><text x="1012" y="761" fill="#fff" font-size="13" font-weight="700">Construir comparación A/B…</text></g></svg>